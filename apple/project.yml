name: Plate
options:
  bundleIdPrefix: app.useplate
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "15.0"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.55.1
  PlateKit:
    path: PlateKit

settings:
  base:
    SWIFT_VERSION: 5.9
    PRODUCT_NAME: Plate
    GENERATE_INFOPLIST_FILE: NO

targets:
  # iPhone/iPad: reads Apple Health and syncs it to Supabase.
  Plate-iOS:
    type: application
    platform: iOS
    sources:
      - Shared
      - iOS
    dependencies:
      - package: Supabase
        product: Supabase
      - package: PlateKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.useplate.ios
        INFOPLIST_FILE: iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: iOS/Plate.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: []

  # Mac: the main dashboard. Reads health data from Supabase (the Mac has no
  # Apple Health store).
  Plate-macOS:
    type: application
    platform: macOS
    sources:
      - Shared
      - macOS
    dependencies:
      - package: Supabase
        product: Supabase
      - package: PlateKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.useplate.mac
        INFOPLIST_FILE: macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: macOS/Plate.entitlements
        ENABLE_HARDENED_RUNTIME: YES
    scheme:
      testTargets: []
