name: Plate
options:
  bundleIdPrefix: app.useplate
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.55.1

targets:
  Plate:
    type: application
    platform: iOS
    sources:
      - PlateApp
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.useplate.ios
        PRODUCT_NAME: Plate
        SWIFT_VERSION: 5.9
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        INFOPLIST_FILE: PlateApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: PlateApp/PlateApp.entitlements
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: []
